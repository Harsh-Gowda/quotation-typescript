<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuoteFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        window.Ghost = window.Ghost || { q: [] };

        // Initialize tracker pointing to your new Edge Worker!
        Ghost.q.push(['init', {
            siteId: 'ghost_test_key_abc123',
            endpoint: 'https://ingest.inktypelabs.in/api/ingest'
        }]);

        // We explicitly grant consent for this internal test so it tracks immediately
        Ghost.q.push(['grantConsent']);
    </script>
    <script async src="https://pub-959ba9b1435842fcb63c3f83314db149.r2.dev/sdk/ghost.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        @media print {
            @page {
                margin: 1cm;
                size: portrait;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            body {
                background-color: white;
                margin: 0;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* Ensure main container takes full width */
            #root,
            main {
                width: 100%;
                margin: 0;
                padding: 0;
            }
        }

        /* Hide scrollbar for gallery */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
